# CORE-MAS E0 cloud probe config (AutoDL 4090) — based on E-mem config.text.yaml
# Differences from stock: local llama.cpp server endpoint, absolute data-disk paths, ratio 0.5

tokenizer:
  model_id: "/root/autodl-tmp/core-mas/models/qwen3-tokenizer"  # local copy (HF per-agent fetch is slow via proxy)

model:
  memory_agent_model:
    openai_config: {
      "api_key":"YOUR_API_KEY",
      "base_url":"http://127.0.0.1:6006/v1",
      "model":"qwen3-4b-local"
    }
    model_context_window: 32768

  general_model:
    openai_config: {
      "api_key":"YOUR_API_KEY",
      "base_url":"http://127.0.0.1:6006/v1",
      "model":"qwen3-4b-local"
    }

  manager_model: null
  aggregator_model: null
  question_answer_model: null
  router_fallback_model: null

memory:
  storage_mode: "text"
  clean_cache_first: true
  router_system_prompt: null
  overlap_ratio: 0.1
  overlap_mode: "chunk"
  block_size_ratio: 0.125
  max_concurrent_gpu_operations: 2
  max_memory_segments: 5
  max_blocks: 5
  query_batch_size: 4
  max_parallel_cache_loads: 8
  enable_router: true
  router_type: "hybrid"

  hybrid_router:
    embedding_provider: "huggingface"
    embedding_model: "/root/autodl-tmp/core-mas/models/minilm"  # local copy
    embedding_config: null
    summary_weight: 0.3
    text_weight: 0.4
    bm25_weight: 0.3
    summary_top_k: 10
    text_top_k: 20
    bm25_top_k: 10
    text_chunk_size: 512
    text_chunk_overlap: 50
    use_llm_fallback: false
    bm25_use_jieba: false
    bm25_boost_threshold: 0.7

locomo_eval:
  specific_questions_path: "/root/autodl-tmp/core-mas/probe72_questions.json"
  dataset_path: "/root/autodl-tmp/core-mas/locomo10.json"
  output_dir: "/root/autodl-tmp/core-mas/run_e0/results"
  ratio: 0.5
  conversation_auto_save: true
  categories: [1, 2, 3, 4, 5]

logging:
  log_dir: "/root/autodl-tmp/core-mas/run_e0/logs"
  log_level: "INFO"
